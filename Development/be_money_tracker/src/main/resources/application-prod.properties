# ===== PRODUCTION PROFILE =====
# To be used on Railway. All sensitive values come from environment variables
# set in Railway dashboard. Do NOT commit real values.

spring.application.name=moneytracker

# ----- App URL -----
app.url=https://moneytrackerapp.up.railway.app

# ----- Database -----
# Hardcoded for simplicity. Same connection that works on local.
# If you later move MySQL, update this line + commit + push.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Serialize LocalDate / LocalDateTime as ISO strings (not numeric arrays)
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- JWT (override the dev secret in production) -----
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=86400000

# ----- Email (Gmail SMTP) -----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ----- Gemini AI (optional in prod) -----
# Use AI_GEMINI_* env var names (Spring Boot maps UPPER_SNAKE -> lower.case).
ai.gemini.apiKey=${AI_GEMINI_APIKEY:}
ai.gemini.model=${AI_GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.mock=${AI_GEMINI_MOCK:false}

# ----- Server -----
# server.port is passed via -Dserver.port in the Dockerfile ENTRYPOINT.
# Do NOT set it here — Spring's property resolution can't read shell env vars.

# ----- Health (actuator) -----
# Show full health details (so we can see why it's DOWN if MySQL fails)
management.endpoint.health.show-details=always
# Make DB part of health (default: true in Spring Boot 3, but be explicit)
management.health.db.enabled=true
# Don't fail health just because mail server is unreachable in dev
management.health.mail.enabled=false
