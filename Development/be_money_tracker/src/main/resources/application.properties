spring.application.name=moneytracker

# Config url-default
app.url=http://localhost:8080


# Config database (MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/moneytracker_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Tu dong tao/cap nhat schema theo model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

 # Serialize Java 8 date/time (LocalDate, LocalDateTime) as ISO strings
 # instead of numeric arrays, so the React Native client can parse them
 # with String methods like .split('-'). Default Jackson emits [2026, 6, 1].
 spring.jackson.serialization.write-dates-as-timestamps=false


